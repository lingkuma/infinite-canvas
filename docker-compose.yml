services:
  app:
    image: infinite-canvas:local
    container_name: infinite-canvas
    build:
      context: .
      dockerfile: Dockerfile.local-runtime
    ports:
      - "0.0.0.0:${APP_PORT:-3000}:3000"
    environment:
      DEFAULT_API_BASE_URL: ${DEFAULT_API_BASE_URL:-}
      DEFAULT_API_KEY: ${DEFAULT_API_KEY:-}
      DEFAULT_IMAGE_MODEL: ${DEFAULT_IMAGE_MODEL:-gpt-image-2.5}
      GROK_IMAGE2_API_KEY: ${GROK_IMAGE2_API_KEY:-}
      GROK_IMAGE2_MODEL: ${GROK_IMAGE2_MODEL:-grok-imagine-image-2.0}
      NANO_BANANA_API_KEY: ${NANO_BANANA_API_KEY:-}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-nano-banana-2.1}
      DEFAULT_PROXY_ENABLED: ${DEFAULT_PROXY_ENABLED:-false}
      DEFAULT_PROXY_URL: ${DEFAULT_PROXY_URL:-}
    restart: unless-stopped

  proxy:
    build:
      context: ./canvas-proxy
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:${PROXY_PORT:-23210}:23210"
    restart: unless-stopped
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID
