server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 入口页面禁止缓存，确保发版后浏览器立即加载新的带 hash 资源。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
